name: Fetch odds snapshot

on:
  workflow_dispatch: {}
  schedule:
    # Dense: every 3 hours, Thursday–Saturday (UTC dow 4,5,6) — the window
    # where lines actually move as injury news lands and money comes in.
    # Deliberately includes 14:00 UTC so it lines up with the daily anchor
    # below rather than sampling on a different clock each day.
    - cron: "0 2,5,8,11,14,17,20,23 * * 4,5,6"
    # Anchor: once a day at 14:00 UTC, every day (Sunday–Wednesday here;
    # Thu–Sat get their 14:00 run from the dense schedule above). Together
    # these give a same-time snapshot on all seven days, so "Monday's
    # opening line vs. Saturday's closing line" is a clean same-clock
    # comparison, not just whatever the dense window happened to catch.
    - cron: "0 14 * * 0,1,2,3"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/fetch_odds.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/odds/
          git diff --cached --quiet && exit 0
          git commit -m "chore(bot): update odds snapshot [automated]"
          git push
