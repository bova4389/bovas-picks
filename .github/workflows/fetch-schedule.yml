name: Refresh schedule

# The committed schedule is the backbone the Schedule tab renders from — all
# 18 weeks, kickoff times, and final scores once played. Live in-game scores
# do NOT come from here; the browser pulls those straight from ESPN (see
# js/espn.js). This job only has to keep the skeleton current, which means
# catching flex-scheduling moves and filling in final scores.
#
# Tuesday 15:23 UTC = after Monday night is over everywhere, and before the
# week's flex decisions land. No secret needed; the endpoint is keyless.
#
# Minute :23 for the same reason fetch-odds.yml uses :17 — GitHub drops
# scheduled runs under load and the contention peak is on the hour. This job
# fires once a WEEK, so a dropped run costs seven days of stale scores AND,
# since 2026-08-28, seven days of un-rebuilt projections. Off-the-hour matters
# more here than on the odds job, not less.

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Season to fetch (defaults to the current one)"
        required: false
        type: string
  schedule:
    - cron: "23 15 * * 2"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the season
        id: season
        # A season is named for the year it starts in, so Jan/Feb still belong
        # to the previous one. Same rule as js/season.js seasonOf() — if you
        # change one, change the other.
        run: |
          if [ -n "${{ inputs.year }}" ]; then
            echo "year=${{ inputs.year }}" >> "$GITHUB_OUTPUT"
          else
            m=$(date -u +%m); y=$(date -u +%Y)
            [ "$m" -lt 3 ] && y=$((y - 1))
            echo "year=$y" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch schedule
        run: python3 scripts/fetch_schedule.py "${{ steps.season.outputs.year }}"

      # MUST follow the schedule fetch, and must not be split into its own
      # workflow. The model trains on completed games, and the step above is
      # what fills in Sunday's and Monday's final scores -- so a rebuild that
      # ran on any other trigger would re-train on the same games it saw last
      # week and quietly write an identical file.
      #
      # Without this step the projections stay frozen at their PRESEASON state
      # (`trainedOnThisSeason: 0`), which is the state the script itself warns
      # is the most compressed: nothing reaches 80%, only ~16 of 272 games
      # reach 70%, because every rating is last season's regressed 0.40 toward
      # average. The spread widens as real results displace that prior, so
      # these sharpen from roughly week 4 -- but only if something re-runs
      # them. Nothing did until 2026-08-28, and the Planning tab's whole
      # week-against-week ordering reads this file.
      - name: Rebuild projections
        run: python3 scripts/build_projections.py "${{ steps.season.outputs.year }}"

      - name: Commit schedule and projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule-*.json data/projections-*.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(bot): refresh ${{ steps.season.outputs.year }} schedule + projections [automated]"
          git push
